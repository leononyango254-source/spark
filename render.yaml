services:
  - type: web
    name: spark-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install -g pnpm@12.8.1 && pnpm install --frozen-lockfile && pnpm build
    startCommand: bash scripts/start-api.sh
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.18.0"
      - key: NODE_ENV
        value: production
      - key: WEB_DIST_DIR
        value: apps/telegram-mini-app/dist
      - key: TELEGRAM_APP_NAME
        value: spark
      - key: TELEGRAM_BOT_USERNAME
        value: sparkjs_bot
      - key: SESSION_TTL_SECONDS
        value: "2592000"
      - key: MEMBERSHIP_CACHE_TTL_MS
        value: "300000"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBAPP_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SETTLEMENT_ENABLED
        value: "true"
      - key: SETTLE_INTERVAL_SECONDS
        value: "15"
      - key: RECONCILE_INTERVAL_SECONDS
        value: "30"
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.io
      - key: ARC_CHAIN_ID
        value: "5042002"
      - key: ARC_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: ESCROW_ADDRESS
        value: "0x9539efAFf246799827E6F5E6Cbc475122710Ef64"
      - key: ADMIN_TOKEN
        sync: false
      - key: OPERATOR_PRIVATE_KEY
        sync: false
